version: '3.8'
services:
app:
build: .
env_file: .env
ports:
- "3000:3000"
depends_on:
- db
- redis
volumes:
- ./:/app
command: npm run dev
db:
image: postgres:15
environment:
POSTGRES_DB: gatherdb
POSTGRES_USER: postgres
POSTGRES_PASSWORD: password
ports:
- "5432:5432"
volumes:
- pgdata:/var/lib/postgresql/data
redis:
image: redis:7
ports:
- "6379:6379"
volumes:
pgdata: